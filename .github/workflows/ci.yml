name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d obrail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: obrail
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/obrail
      APP_ENV: ci
      APP_VERSION: 2.1.0
      API_URL: http://localhost:8000
      ENABLE_PROMETHEUS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r dashboard/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare environment file for Docker Compose
        run: |
          cat <<'EOF' > .env
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=obrail
          DATABASE_URL=postgresql://postgres:postgres@db:5432/obrail
          APP_ENV=ci
          APP_VERSION=2.1.0
          LOG_LEVEL=INFO
          ENABLE_PROMETHEUS=true
          API_URL=http://api:8000
          PROMETHEUS_URL=http://localhost:9090
          GRAFANA_URL=http://localhost:3000
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=admin
          CORS_ORIGINS=http://localhost:8501,http://127.0.0.1:8501,http://localhost:5173,http://127.0.0.1:5173
          TRANSITLAND_ENABLED=false
          EOF

      - name: Initialize database schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d obrail -f database/init.sql

      - name: Run tests
        run: pytest -q

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate docker-compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build api dashboard etl
