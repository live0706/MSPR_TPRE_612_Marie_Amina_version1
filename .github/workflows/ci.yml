name: CI

on:
  push:
    branches: ["main", "master", "next"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: obrail
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/obrail
      APP_ENV: ci
      APP_VERSION: 2.1.0
      API_URL: http://localhost:8000
      ENABLE_PROMETHEUS: "true"
      DATA_DIR: ${{ github.workspace }}/data
      QUALITY_REPORT_PATH: ${{ github.workspace }}/data/processed/quality_report.json
      MODEL_METRICS_PATH: ${{ github.workspace }}/data/processed/model_metrics.json
      APP_LOG_PATH: ${{ github.workspace }}/data/logs/api.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare local data directories
        run: |
          mkdir -p data/logs
          mkdir -p data/processed

      - name: Prepare environment file for Docker Compose
        run: |
          cat <<'EOF' > .env
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=obrail
          DATABASE_URL=postgresql://postgres:postgres@db:5432/obrail
          APP_ENV=ci
          APP_VERSION=2.1.0
          LOG_LEVEL=INFO
          ENABLE_PROMETHEUS=true
          API_URL=http://api:8000
          PROMETHEUS_URL=http://localhost:9090
          GRAFANA_URL=http://localhost:3000
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=admin
          CORS_ORIGINS=http://localhost:8501,http://127.0.0.1:8501,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
          TRANSITLAND_ENABLED=false
          EOF

      - name: Start PostgreSQL service with Docker Compose
        run: docker compose up -d db

      - name: Initialize database schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d obrail -f database/init.sql

      - name: Run tests
        run: pytest -q

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Create health artefacts for E2E
        run: |
          mkdir -p data/processed
          printf '{}' > data/processed/quality_report.json
          printf '{}' > data/processed/model_metrics.json

      - name: Seed PostgreSQL for frontend E2E
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d obrail -f database/seed_e2e.sql

      - name: Start API for frontend E2E
        run: |
          cd api
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../api-e2e.log 2>&1 &
          echo $! > ../api-e2e.pid

      - name: Wait for API readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat api-e2e.log
          exit 1

      - name: Run frontend E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run e2e

      - name: Validate docker-compose
        run: docker compose config

      - name: Export resolved docker-compose
        run: docker compose config > docker-compose.resolved.yml

      - name: Build Docker images
        run: docker compose build api dashboard etl

      - name: Upload frontend build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload API E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-log
          path: api-e2e.log
          if-no-files-found: ignore

      - name: Upload resolved compose artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-resolved
          path: docker-compose.resolved.yml
          if-no-files-found: warn
