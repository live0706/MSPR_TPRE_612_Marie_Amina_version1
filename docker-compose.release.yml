services:
  db:
    image: postgres:15-alpine
    container_name: obrail_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - obrail_net

  etl:
    image: ghcr.io/${GHCR_OWNER:-live0706}/obrail-etl:${IMAGE_TAG:-latest}
    container_name: obrail_etl
    pull_policy: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_DIR: /app/data
      PAN_MAX_FEEDS: 50
      PAN_ONLY_GTFS: "true"
      PAN_ONLY_RAIL: "true"
      RESET_DB: "false"
      LONG_DISTANCE_MIN_KM: "300"
      GTFS_MIN_SERVICE_DATE: "2015-01-01"
      GTFS_MAX_SERVICE_DAYS: "0"
      TRANSITLAND_ENABLED: "false"
    volumes:
      - ./data:/app/data
    restart: "no"
    networks:
      - obrail_net

  api:
    image: ghcr.io/${GHCR_OWNER:-live0706}/obrail-api:${IMAGE_TAG:-latest}
    container_name: obrail_api
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-2.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_DIR: /app/data
      QUALITY_REPORT_PATH: /app/data/processed/quality_report.json
      MODEL_METRICS_PATH: /app/data/processed/model_metrics.json
      ENABLE_PROMETHEUS: ${ENABLE_PROMETHEUS:-true}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://localhost:9090}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"
    networks:
      - obrail_net

  dashboard:
    image: ghcr.io/${GHCR_OWNER:-live0706}/obrail-dashboard:${IMAGE_TAG:-latest}
    container_name: obrail_dashboard
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "8501:80"
    networks:
      - obrail_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: obrail_prometheus
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - obrail_net

  grafana:
    image: grafana/grafana-oss:11.1.4
    container_name: obrail_grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - obrail_net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  obrail_net:
    driver: bridge
